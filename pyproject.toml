[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algotrade"
version = "0.1.0"
description = "Personal India algo-trading research platform -- Phase 0 data capture layer"
requires-python = ">=3.11"
dependencies = [
    "growwapi",
    "pyotp",
    "psycopg2-binary",
    "PyYAML",
    "requests",
    "pandas",
    "scikit-learn",
    "openpyxl",
]

[tool.setuptools.packages.find]
where = ["src"]
