services:
  timescaledb:
    image: timescale/timescaledb-ha:pg16-all
    container_name: algotrade-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: algotrade
      POSTGRES_USER: algotrade
      # Local-only dev DB -- override via a POSTGRES_PASSWORD system env var for anything
      # beyond a single-user personal machine. Not a Groww credential, so a default is fine here.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-algotrade_local_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/home/postgres/pgdata/data
    # Resource budget for a 16GB-RAM, no-GPU machine (see plan) -- leaves headroom for
    # normal machine use and other Compose services (MLflow/Prefect/Grafana) added later.
    mem_limit: 4g
    cpus: 4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algotrade -d algotrade"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  timescaledb_data:
